# rift window manager config
# Symlinked to ~/.config/rift/config.toml by install.sh
# Command/option reference: https://github.com/acsandmann/rift/wiki/Config

[settings]
# Animations tend to feel better off in a scrolling layout.
animate = true
animation_duration = 0.25
animation_fps = 120.0

# Mouse / focus behavior
focus_follows_mouse = true
mouse_follows_focus = true
mouse_hides_on_focus = false

# Manage every Space/display automatically. rift defaults this to true, which
# leaves a Space unmanaged until you opt in with Alt+Z (toggle_space_activated);
# an unmanaged Space is invisible to focus_display/move_window_to_display, so
# cross-monitor focus silently no-ops. false = manage everything by default.
default_disable = false

# Watch this file and reload automatically on save.
hot_reload = true

# Nudge sketchybar to redraw its workspace items whenever rift's state changes
# (see sketchybar/plugins/rift_item.sh). rift appends the event JSON as a
# trailing arg, which `sh -c` drops into $0 and ignores.
run_on_start = [
  "rift-cli subscribe cli --event workspace_changed --command sh --args -c --args 'exec sketchybar --trigger rift_change'",
  "rift-cli subscribe cli --event windows_changed --command sh --args -c --args 'exec sketchybar --trigger rift_change'",
  "rift-cli subscribe cli --event focused_window_changed --command sh --args -c --args 'exec sketchybar --trigger rift_change'",
]
auto_focus_blacklist = []

[settings.layout]
# niri-style scrolling columns as the default layout for every workspace.
#   "traditional" | "bsp" | "stack" | "master_stack" | "scrolling"
mode = "scrolling"
# New windows open immediately to the right of the focused one.
window_insertion_point = "next_to_selection"

[settings.layout.scrolling]
# Width of the active column as a fraction of screen width, with clamp bounds
# used by the resize commands.
column_width_ratio = 0.5
min_column_width_ratio = 0.3
max_column_width_ratio = 0.9
# Alignment only applies when focus_navigation_style = "anchored".
alignment = "center"
# "niri": reveal columns only as needed based on navigation direction.
# "anchored": always align the focused column per `alignment`.
focus_navigation_style = "niri"

[settings.layout.scrolling.gestures]
# Two-/three-finger horizontal scroll to move between columns.
enabled = false
invert_horizontal = false
fingers = 3
propagate_to_workspace_swipe = false

[settings.layout.gaps.outer]
top = 0
left = 0
# Reserve room for the bottom sketchybar (position=bottom, height=40) so tiled
# windows don't cover it.
bottom = 40
right = 0

[settings.layout.gaps.inner]
horizontal = 0
vertical = 0

[virtual_workspaces]
enabled = true
default_workspace_count = 4
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = true
reapply_app_rules_on_title_change = false
workspace_rules = []
app_rules = []

# Reusable modifier combo: comb1 == Alt + Shift
[modifier_combinations]
comb1 = "Alt + Shift"

[keys]
# --- Focus (Alt) ---------------------------------------------------------
# In the scrolling layout the primary axis is horizontal, so j/k drive the
# columns (left/right) within a display. h/l move focus between physical
# displays, stacked vertically here (h = up, l = down).
"Alt + H" = { exec = ["sh", "-c", "exec \"$HOME/src/dotfiles/bin/rift-focus-display.sh\" up"] }
"Alt + J" = { move_focus = "left" }
"Alt + K" = { move_focus = "right" }
"Alt + L" = { exec = ["sh", "-c", "exec \"$HOME/src/dotfiles/bin/rift-focus-display.sh\" down"] }

# --- Move the focused window (Alt + Shift) -------------------------------
# Mirrors the focus axis: j/k shift the column within the display, h/l send the
# focused window to the display above/below.
"comb1 + H" = { move_window_to_display = { selector = "up" } }
"comb1 + J" = { move_node = "left" }
"comb1 + K" = { move_node = "right" }
"comb1 + L" = { move_window_to_display = { selector = "down" } }

# --- Workspaces ----------------------------------------------------------
"Alt + 0" = { switch_to_workspace = 0 }
"Alt + 1" = { switch_to_workspace = 1 }
"Alt + 2" = { switch_to_workspace = 2 }
"Alt + 3" = { switch_to_workspace = 3 }

"comb1 + 0" = { move_window_to_workspace = 0 }
"comb1 + 1" = { move_window_to_workspace = 1 }
"comb1 + 2" = { move_window_to_workspace = 2 }
"comb1 + 3" = { move_window_to_workspace = 3 }

"Alt + Tab" = "switch_to_last_workspace"

# --- Layout / rift control ----------------------------------------------
"comb1 + C" = { exec = ["brew", "services", "restart", "rift"] }
"comb1 + B" = { exec = ["sketchybar", "reload"] }

# --- Window management ----------------------------------------------------
"comb1 + Space" = "toggle_window_floating"
"comb1 + F" = "toggle_fullscreen_within_gaps"

"Alt + Z" = "toggle_space_activated"
"Alt + Enter" = { "exec" = ["open", "-na", "/Applications/Ghostty.app"] }
